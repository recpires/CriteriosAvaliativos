<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critérios Avaliativos 2026</title>

    <link rel="icon" type="image/png" href="Santo André-horizontal.png">

    <style>
        :root {
            --blue-dark: #003358;
            --blue-bright: #004a80;
            --teal: #0097a7;
            --bg-gray: #f4f7f9;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 30px 20px;
        }

        .logo {
            max-width: 320px;
            height: auto;
        }

        .title-section {
            background-color: var(--blue-dark);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 10px solid var(--teal);
        }

        .title-section h1 {
            margin: 0;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-content {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .category-label {
            grid-column: 1 / -1;
            color: var(--teal);
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .card-turma {
            background: white;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--blue-dark);
            font-weight: 600;
            text-decoration: none;
            /* Garante que não pareça um link comum */
        }

        .card-turma:hover {
            background-color: var(--blue-dark);
            color: white;
            border-color: var(--blue-dark);
            box-shadow: 0 4px 12px rgba(0, 51, 88, 0.3);
        }

        .icon {
            font-size: 1.2rem;
        }

        @media (max-width: 650px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <img src="Santo André-horizontal.png" alt="Colégio Adventista Santo André" class="logo">
        </header>

        <div class="title-section">
            <h1>Critérios Avaliativos</h1>
            <span>1º Bimestre 2026</span>
        </div>

        <div class="main-content">

            <div class="category-label">ENSINO FUNDAMENTAL II</div>

            <div class="card-turma" onclick="downloadPDF('6º ano 1bim 2026.pdf')">
                <span>6º Ano</span> <span class="icon">📥</span>
            </div>

            <div class="card-turma" onclick="downloadPDF('7º ano 1bim 2026.pdf')">
                <span>7º Ano</span> <span class="icon">📥</span>
            </div>

            <div class="card-turma" onclick="downloadPDF('8º ano 1ºbim 2026.pdf')">
                <span>8º Ano</span> <span class="icon">📥</span>
            </div>

            <div class="card-turma" onclick="downloadPDF('9º ano 1ºBim 2026.pdf')">
                <span>9º Ano</span> <span class="icon">📥</span>
            </div>

            <div class="category-label">ENSINO MÉDIO</div>

            <div class="card-turma" onclick="downloadPDF('1º Médio 1ºbim 2026.pdf')">
                <span>1ª Médio</span> <span class="icon">📥</span>
            </div>

            <div class="card-turma" onclick="downloadPDF('2º Médio 1BIM 2026.pdf')">
                <span>2ª Médio</span> <span class="icon">📥</span>
            </div>

            <div class="card-turma" onclick="downloadPDF('3º Médio 1BIM 2026.pdf')">
                <span>3ª Médio</span> <span class="icon">📥</span>
            </div>

        </div>
    </div>

    <script>
        function downloadPDF(fileName) {
            // Cria um elemento de link temporário
            const link = document.createElement('a');
            link.href = fileName;
            link.download = fileName;

            // Adiciona ao corpo do documento, clica e remove
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>

</html>
