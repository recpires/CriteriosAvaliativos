<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critérios Avaliativos 2026 - Colégio Adventista</title>

    <link rel="icon" type="image/png" href="EA-3-azul com A pintado de branco.png">

    <style>
        :root {
            --blue-dark: #003358;
            --teal: #0097a7;
            --bg-light: #f4f7f9;
            --white: #ffffff;
            --border-color: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            max-width: 280px;
            height: auto;
        }

        .header-bar {
            background-color: var(--blue-dark);
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 8px solid var(--teal);
            margin-bottom: 30px;
        }

        .header-bar h1 {
            margin: 0;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 0 40px;
        }

        .column-title {
            background-color: var(--blue-dark);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .section-label {
            color: var(--teal);
            font-weight: bold;
            font-size: 0.9rem;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .card-turma {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--blue-dark);
            font-weight: 500;
            text-decoration: none;
        }

        .card-turma:hover {
            background-color: var(--blue-dark);
            color: var(--white);
            border-color: var(--blue-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 51, 88, 0.2);
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

</body>
